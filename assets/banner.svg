<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0b486b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f56217;stop-opacity:1" />
      <animate attributeName="x1" values="0%;100%;0%" dur="10s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;0%;100%" dur="10s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" rx="15" ry="15" />
  <text x="50%" y="45%" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">
    Awesome Patient Flow Optimization
  </text>
  <text x="50%" y="70%" font-family="Arial, sans-serif" font-size="20" fill="#f0f0f0" text-anchor="middle" dominant-baseline="middle">
    Curated tools &amp; open-source platforms for healthcare capacity
  </text>
  <circle cx="50" cy="50" r="10" fill="white" opacity="0.5">
    <animate attributeName="cy" values="50;150;50" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="750" cy="150" r="10" fill="white" opacity="0.5">
    <animate attributeName="cy" values="150;50;150" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
